<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur Sistem Otentikasi Ijazah Digital</title>
  <desc id="desc">Diagram aliran data antara SIA Simulasi, Mock PDDikti dan PISN, SIVIL Simulasi, IPFS melalui Pinata, serta Polygon Amoy dan smart contract.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #64748b; }
      .box-title { font: 700 23px Arial, sans-serif; fill: #172033; }
      .box-subtitle { font: 600 16px Arial, sans-serif; }
      .bullet { font: 400 16px Arial, sans-serif; fill: #334155; }
      .arrow-label { font: 600 15px Arial, sans-serif; fill: #25324a; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
      .arrow-sub { font: 400 13px Arial, sans-serif; fill: #64748b; paint-order: stroke; stroke: #fff; stroke-width: 6px; }
      .number { font: 700 17px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 400 14px Arial, sans-serif; fill: #526078; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title">Arsitektur Sistem Otentikasi Ijazah Digital</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">Aliran aktual pada implementasi tiga subsistem, IPFS, dan smart contract Polygon Amoy</text>

  <!-- SIA -->
  <g filter="url(#shadow)">
    <rect x="55" y="245" width="350" height="305" rx="20" fill="#f4f9ff" stroke="#2684d8" stroke-width="2.2"/>
  </g>
  <circle cx="230" cy="292" r="28" fill="#e0efff" stroke="#2684d8" stroke-width="2"/>
  <path d="M216 292h28M220 282h20M220 302h20M224 274h12v36h-12z" fill="none" stroke="#2684d8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="230" y="340" text-anchor="middle" class="box-title">1. SIA Simulasi</text>
  <text x="230" y="365" text-anchor="middle" class="box-subtitle" fill="#1d6fae">Sistem Informasi Akademik</text>
  <line x1="85" y1="386" x2="375" y2="386" stroke="#b9d9f4" stroke-width="2"/>
  <text x="90" y="420" class="bullet">• kelola mahasiswa dan kelulusan</text>
  <text x="90" y="449" class="bullet">• ajukan reservasi NINA</text>
  <text x="90" y="478" class="bullet">• buat PDF dan QR menuju SIVIL</text>
  <text x="90" y="507" class="bullet">• enkripsi, mint, baca, dan revoke</text>

  <!-- Mock PDDikti / PISN -->
  <g filter="url(#shadow)">
    <rect x="620" y="135" width="360" height="275" rx="20" fill="#fffaf0" stroke="#d89917" stroke-width="2.2"/>
  </g>
  <circle cx="800" cy="181" r="28" fill="#fff0c7" stroke="#d89917" stroke-width="2"/>
  <ellipse cx="800" cy="171" rx="15" ry="6" fill="none" stroke="#d89917" stroke-width="2.5"/>
  <path d="M785 171v21c0 4 7 7 15 7s15-3 15-7v-21M785 181c0 4 7 7 15 7s15-3 15-7" fill="none" stroke="#d89917" stroke-width="2.5"/>
  <text x="800" y="229" text-anchor="middle" class="box-title">2. Mock PDDikti dan PISN</text>
  <line x1="650" y1="250" x2="950" y2="250" stroke="#edd49a" stroke-width="2"/>
  <text x="658" y="282" class="bullet">• menerima lapor data dan kelulusan</text>
  <text x="658" y="311" class="bullet">• validasi eligibilitas</text>
  <text x="658" y="340" class="bullet">• reservasi dan penerbitan NINA</text>
  <text x="658" y="369" class="bullet">• sinkronisasi status registri</text>

  <!-- SIVIL -->
  <g filter="url(#shadow)">
    <rect x="1195" y="245" width="350" height="305" rx="20" fill="#f4fbf3" stroke="#4a9b42" stroke-width="2.2"/>
  </g>
  <circle cx="1370" cy="292" r="28" fill="#e4f5e1" stroke="#4a9b42" stroke-width="2"/>
  <circle cx="1370" cy="292" r="16" fill="none" stroke="#4a9b42" stroke-width="2"/>
  <path d="M1354 292h32M1370 276c-7 7-7 25 0 32M1370 276c7 7 7 25 0 32" fill="none" stroke="#4a9b42" stroke-width="2"/>
  <path d="M1382 304l6 6 12-15" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1370" y="340" text-anchor="middle" class="box-title">3. SIVIL Simulasi</text>
  <line x1="1225" y1="365" x2="1515" y2="365" stroke="#bde0b9" stroke-width="2"/>
  <text x="1230" y="400" class="bullet">• portal verifikasi publik</text>
  <text x="1230" y="429" class="bullet">• periksa registri NINA lokal</text>
  <text x="1230" y="458" class="bullet">• minta status on-chain via API SIA</text>
  <text x="1230" y="487" class="bullet">• gabungkan status registri × token</text>
  <text x="1230" y="516" class="bullet">• keputusan valid atau tidak valid</text>

  <!-- Public user -->
  <g filter="url(#shadow)">
    <rect x="1230" y="105" width="280" height="90" rx="18" fill="#f8fafc" stroke="#78909c" stroke-width="1.8"/>
  </g>
  <circle cx="1273" cy="150" r="20" fill="#e8eef2"/>
  <circle cx="1273" cy="143" r="7" fill="none" stroke="#526776" stroke-width="2"/>
  <path d="M1259 166c2-10 8-15 14-15s12 5 14 15" fill="none" stroke="#526776" stroke-width="2"/>
  <text x="1305" y="143" class="box-subtitle" fill="#3e5362">Pengguna publik</text>
  <text x="1305" y="167" class="bullet">input NINA / pindai QR</text>

  <!-- IPFS -->
  <g filter="url(#shadow)">
    <rect x="245" y="720" width="390" height="195" rx="20" fill="#faf6ff" stroke="#8b5cc7" stroke-width="2.2"/>
  </g>
  <circle cx="440" cy="765" r="27" fill="#efe4ff" stroke="#8b5cc7" stroke-width="2"/>
  <path d="M426 772c-8 0-10-13-1-17 3-11 20-11 23 0 10 1 11 17 0 17h-22zM440 779v-18M433 768l7-7 7 7" fill="none" stroke="#8b5cc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="812" text-anchor="middle" class="box-title">4. IPFS melalui Pinata</text>
  <line x1="275" y1="832" x2="605" y2="832" stroke="#d9c2f2" stroke-width="2"/>
  <text x="282" y="862" class="bullet">• PDF dan metadata terenkripsi</text>
  <text x="282" y="889" class="bullet">• metadata memuat CID PDF terenkripsi</text>

  <!-- Polygon -->
  <g filter="url(#shadow)">
    <rect x="910" y="720" width="420" height="195" rx="20" fill="#fff5f5" stroke="#e35151" stroke-width="2.2"/>
  </g>
  <circle cx="1120" cy="765" r="27" fill="#ffe0e0" stroke="#e35151" stroke-width="2"/>
  <path d="M1105 767l15-10 15 10-15 10zM1105 767v14l15 9 15-9v-14M1120 777v13" fill="none" stroke="#e35151" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="1120" y="812" text-anchor="middle" class="box-title">5. Polygon Amoy + Smart Contract</text>
  <line x1="940" y1="832" x2="1300" y2="832" stroke="#f1bcbc" stroke-width="2"/>
  <text x="947" y="862" class="bullet">• hashed NIM/NINA, CID metadata, status token</text>
  <text x="947" y="889" class="bullet">• non-transferable, RBAC, mint, dan revoke</text>

  <!-- 1: SIA to Mock -->
  <path d="M405 305 C485 305 535 280 620 280" fill="none" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <circle cx="492" cy="286" r="15" fill="#2563eb"/><text x="492" y="286" class="number">1</text>
  <text x="512" y="268" text-anchor="middle" class="arrow-label">lapor data/lulus</text>
  <text x="512" y="287" text-anchor="middle" class="arrow-sub">dan reservasi NINA</text>

  <!-- 2: Mock to SIA -->
  <path d="M620 353 C535 353 490 380 405 380" fill="none" stroke="#d97706" stroke-width="2.7" marker-end="url(#arrow-orange)"/>
  <circle cx="500" cy="367" r="15" fill="#d97706"/><text x="500" y="367" class="number">2</text>
  <text x="518" y="403" text-anchor="middle" class="arrow-label">respons status + NINA</text>

  <!-- 3: Mock to SIVIL -->
  <path d="M980 285 C1063 285 1110 305 1195 305" fill="none" stroke="#16a34a" stroke-width="2.7" marker-end="url(#arrow-green)"/>
  <circle cx="1085" cy="286" r="15" fill="#16a34a"/><text x="1085" y="286" class="number">3</text>
  <text x="1087" y="258" text-anchor="middle" class="arrow-label">sinkronisasi registri</text>
  <text x="1087" y="278" text-anchor="middle" class="arrow-sub">terbit / revoke NINA</text>

  <!-- 4: SIA to IPFS -->
  <path d="M215 550 C215 635 330 640 360 720" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrow-purple)"/>
  <circle cx="254" cy="622" r="15" fill="#7c3aed"/><text x="254" y="622" class="number">4</text>
  <text x="312" y="604" text-anchor="middle" class="arrow-label">enkripsi + unggah</text>
  <text x="323" y="624" text-anchor="middle" class="arrow-sub">PDF dan metadata</text>

  <!-- 5a: SIA to Polygon -->
  <path d="M355 550 C570 620 740 645 960 720" fill="none" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arrow-red)"/>
  <circle cx="684" cy="638" r="17" fill="#dc2626"/><text x="684" y="638" class="number">5a</text>
  <text x="680" y="607" text-anchor="middle" class="arrow-label">mint/revoke + query RPC</text>
  <text x="680" y="627" text-anchor="middle" class="arrow-sub">hashed NINA, hashed NIM, CID metadata</text>

  <!-- 5b: Polygon to SIA -->
  <path d="M918 735 C720 690 535 665 335 566" fill="none" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <text x="653" y="704" text-anchor="middle" class="arrow-label">5b. receipt / hasil baca: txHash, tokenId, isActive</text>

  <!-- 6: User to SIVIL -->
  <path d="M1370 195 L1370 245" fill="none" stroke="#16a34a" stroke-width="2.7" marker-end="url(#arrow-green)"/>
  <circle cx="1405" cy="220" r="15" fill="#16a34a"/><text x="1405" y="220" class="number">6</text>

  <!-- 7a / 7b: SIVIL via SIA -->
  <path d="M1195 535 C960 600 640 600 405 535" fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#arrow-green)"/>
  <text x="800" y="571" text-anchor="middle" class="arrow-label">7a. SIVIL → SIA: GET /api/verify-nina</text>
  <path d="M405 515 C640 565 960 565 1195 515" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="800" y="523" text-anchor="middle" class="arrow-label">7b. SIA → SIVIL: valid, isActive, tokenId, CID</text>

  <!-- Logical CID reference: no direct communication -->
  <line x1="635" y1="820" x2="910" y2="820" stroke="#64748b" stroke-width="2.2" stroke-dasharray="9 8"/>
  <rect x="681" y="786" width="184" height="59" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="773" y="808" text-anchor="middle" class="arrow-label">CID sebagai referensi</text>
  <text x="773" y="830" text-anchor="middle" class="arrow-sub">bukan komunikasi langsung</text>

  <!-- Legend -->
  <line x1="60" y1="952" x2="110" y2="952" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="120" y="957" class="legend">aliran HTTP/RPC/transaksi</text>
  <line x1="340" y1="952" x2="400" y2="952" stroke="#64748b" stroke-width="2.2" stroke-dasharray="9 8"/>
  <text x="412" y="957" class="legend">referensi logis CID</text>
  <text x="1540" y="957" text-anchor="end" class="legend">Sumber: implementasi final 2026-08-10</text>
</svg>
